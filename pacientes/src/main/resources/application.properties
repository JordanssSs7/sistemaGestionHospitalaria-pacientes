spring.application.name=pacientes

spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3307}/db_hospital
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Administrador inicial: se crea una sola vez, solo si todavia no existe ningun usuario
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.nombre=Administrador del sistema
