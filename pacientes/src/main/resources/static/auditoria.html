<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacientes - Bitácora de auditoría</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/estilos.css">
<style>
    .filtros { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 18px; }
    .filtros > div { flex: 1; min-width: 160px; }
    .filtros button { margin-top: 0; padding: 10px 18px; white-space: nowrap; }
    .etiqueta-op { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .op-REGISTRO { background: #dcfce7; color: #166534; }
    .op-MODIFICACION { background: #fef3c7; color: #92400e; }
    .op-ELIMINACION { background: #fee2e2; color: #991b1b; }
</style>
</head>
<body>

<div class="navbar">
    <a href="index.html" class="logo">
        <span class="icono"><i class="fa-solid fa-hospital"></i></span>
        Módulo Pacientes
    </a>
    <nav>
        <a href="registrar.html"><i class="fa-solid fa-user-plus"></i> Registrar</a>
        <a href="buscar.html"><i class="fa-solid fa-magnifying-glass"></i> Buscar</a>
        <a href="auditoria.html"><i class="fa-solid fa-clipboard-list"></i> Bitácora</a>
    </nav>
</div>

<div class="contenido">
    <div class="card">
        <h2><i class="fa-solid fa-clipboard-list"></i> Bitácora de auditoría</h2>
        <p style="color:#666; font-size:14px; margin-bottom:16px;">
            Registro automático de quién registró, modificó o eliminó información, cuándo lo hizo y sobre qué registro.
        </p>

        <form class="filtros" onsubmit="cargarAuditoria(event)">
            <div>
                <label for="filtroUsuario">Usuario</label>
                <input id="filtroUsuario" type="text" placeholder="Ej: admin">
            </div>
            <div>
                <label for="filtroEntidad">Entidad</label>
                <select id="filtroEntidad">
                    <option value="">Todas</option>
                    <option>Paciente</option>
                    <option>ContactoEmergencia</option>
                    <option>Alergia</option>
                    <option>Usuario</option>
                    <option>Rol</option>
                </select>
            </div>
            <div>
                <label for="filtroOperacion">Operación</label>
                <select id="filtroOperacion">
                    <option value="">Todas</option>
                    <option value="REGISTRO">Registro</option>
                    <option value="MODIFICACION">Modificación</option>
                    <option value="ELIMINACION">Eliminación</option>
                </select>
            </div>
            <button type="submit"><i class="fa-solid fa-filter"></i> Filtrar</button>
        </form>

        <div class="tabla-wrap">
            <table class="historial">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Fecha y hora</th>
                        <th>Usuario</th>
                        <th>Operación</th>
                        <th>Entidad</th>
                        <th>ID registro</th>
                    </tr>
                </thead>
                <tbody id="cuerpoAuditoria">
                    <tr><td colspan="6" style="color:#888; text-align:center; padding:24px;">Cargando bitácora...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="pieDePagina"></div>
</div>

<script src="js/comun.js"></script>
<script>
    function formatearFecha(iso) {
        const f = new Date(iso);
        return isNaN(f) ? escapeHtml(iso) : f.toLocaleString('es-PE');
    }

    async function cargarAuditoria(event) {
        if (event) event.preventDefault();
        const cuerpo = document.getElementById('cuerpoAuditoria');
        const params = new URLSearchParams();
        const usuario = document.getElementById('filtroUsuario').value.trim();
        const entidad = document.getElementById('filtroEntidad').value;
        const operacion = document.getElementById('filtroOperacion').value;
        if (usuario) params.set('usuario', usuario);
        if (entidad) params.set('entidad', entidad);
        if (operacion) params.set('operacion', operacion);

        try {
            const resp = await fetch('/api/auditoria?' + params.toString());
            if (!resp.ok) throw new Error('No se pudo cargar la bitácora');
            const filas = await resp.json();
            if (filas.length === 0) {
                cuerpo.innerHTML = '<tr><td colspan="6" style="color:#888; text-align:center; padding:24px;">No hay registros en la bitácora.</td></tr>';
                return;
            }
            cuerpo.innerHTML = filas.map(a => `
                <tr>
                    <td>${a.idAuditoria}</td>
                    <td>${formatearFecha(a.fechaHora)}</td>
                    <td>${escapeHtml(a.usuario)}</td>
                    <td><span class="etiqueta-op op-${escapeHtml(a.operacion)}">${escapeHtml(a.operacion)}</span></td>
                    <td>${escapeHtml(a.entidad)}</td>
                    <td>${a.idRegistro ?? '-'}</td>
                </tr>
            `).join('');
        } catch (err) {
            cuerpo.innerHTML = `<tr><td colspan="6" style="color:#b91c1c; text-align:center; padding:24px;">${escapeHtml(err.message)}</td></tr>`;
        }
    }

    cargarAuditoria();
</script>
</body>
</html>
