<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacientes - Contactos de emergencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="navbar">
    <a href="index.html" class="logo">
        <span class="icono"><i class="fa-solid fa-hospital"></i></span>
        Módulo Pacientes
    </a>
    <nav>
        <a href="registrar.html"><i class="fa-solid fa-user-plus"></i> Registrar</a>
        <a href="buscar.html"><i class="fa-solid fa-magnifying-glass"></i> Buscar</a>
        <a href="#" class="activo"><i class="fa-solid fa-address-book"></i> Contactos</a>
    </nav>
</div>

<div class="contenido">
    <button class="btn-volver" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Volver</button>

    <div class="resumen-paciente">
        <div class="avatar" id="avatarPaciente">--</div>
        <div class="datos">
            <h2 id="nombreCompleto">Cargando...</h2>
            <div class="meta">
                <span id="metaCodigo"></span>
            </div>
        </div>
        <div class="cta">
            <button id="btnIrPaciente" class="secundario">
                <i class="fa-solid fa-id-card"></i>
                Ver ficha del paciente
            </button>
        </div>
    </div>

    <div class="card">
        <h2><i class="fa-solid fa-address-book"></i> Contactos de emergencia</h2>

        <div id="listaContactos" class="lista-resultados"></div>
    </div>

    <div class="card">
        <h2 id="tituloFormContacto"><i class="fa-solid fa-user-plus"></i> Registrar nuevo contacto</h2>
        <form id="formContacto" onsubmit="guardarContacto(event)">
            <input type="hidden" id="idContactoEdit" value="">
            <div class="grid-2">
                <div>
                    <label>Nombre completo</label>
                    <input id="cNombreCompleto" type="text" required>
                </div>
                <div>
                    <label>Parentesco</label>
                    <input id="cParentesco" type="text" placeholder="Ej: Madre, Esposo, Hermano">
                </div>
            </div>
            <div class="grid-2">
                <div>
                    <label>Teléfono</label>
                    <input id="cTelefono" type="text">
                </div>
                <div>
                    <label>Correo</label>
                    <input id="cCorreo" type="email">
                </div>
            </div>
            <div class="grid-2">
                <div>
                    <label>Dirección</label>
                    <input id="cDireccion" type="text">
                </div>
                <div>
                    <label>Contacto principal</label>
                    <select id="cContactoPrincipal">
                        <option value="false">No</option>
                        <option value="true">Sí</option>
                    </select>
                </div>
            </div>
            <button type="submit" id="btnGuardarContacto">
                <i class="fa-solid fa-check"></i>
                Registrar contacto
            </button>
            <button type="button" class="secundario oculto" id="btnCancelarEdicion" onclick="cancelarEdicionContacto()">Cancelar</button>
            <div id="mensajeContacto" class="mensaje"></div>
        </form>
    </div>

    <div id="pieDePagina"></div>
</div>

<script src="js/comun.js"></script>
<script>
    const idPaciente = obtenerIdPacienteDeUrl();

    if (!idPaciente) {
        window.location.href = 'buscar.html';
    } else {
        document.getElementById('btnIrPaciente').addEventListener('click', () => irAPaciente(idPaciente));
        cargarInfoPaciente();
        cargarContactos();
    }

    async function cargarInfoPaciente() {
        try {
            const resp = await fetch(`${API_BASE}/${idPaciente}`);
            if (!resp.ok) throw new Error('No se pudo cargar el paciente');
            const p = await resp.json();
            document.getElementById('avatarPaciente').textContent = iniciales(p.nombres, p.apellidoPaterno);
            document.getElementById('nombreCompleto').textContent = `${p.nombres ?? ''} ${p.apellidoPaterno ?? ''}`;
            document.getElementById('metaCodigo').textContent = `Código: ${p.codigoPaciente ?? '-'}`;
        } catch (err) {
            mostrarMensaje('mensajeContacto', err.message, 'error');
        }
    }

    async function cargarContactos() {
        const resp = await fetch(`${API_BASE}/${idPaciente}/contactos`);
        const contactos = resp.ok ? await resp.json() : [];
        const lista = document.getElementById('listaContactos');
        lista.innerHTML = '';

        if (contactos.length === 0) {
            lista.innerHTML = `
                <div class="vacio">
                    <i class="fa-solid fa-address-book"></i>
                    <div>Todavía no hay contactos de emergencia registrados.</div>
                </div>`;
            return;
        }

        contactos.forEach(c => {
            const item = document.createElement('div');
            item.className = 'item-resultado';
            item.innerHTML = `
                <div class="avatar contacto">${iniciales(c.nombreCompleto, '')}</div>
                <div class="item-info">
                    <div class="nombre">${escapeHtml(c.nombreCompleto ?? '')} ${c.contactoPrincipal ? '<span class="badge si">Principal</span>' : ''}</div>
                    <div class="meta">${escapeHtml(c.parentesco ?? '-')} · ${escapeHtml(c.telefono ?? '-')} · ${escapeHtml(c.correo ?? '-')}</div>
                </div>
                <div class="item-acciones">
                    <button class="secundario" onclick='editarContacto(${JSON.stringify(c)})'>
                        <i class="fa-solid fa-pen-to-square"></i>
                        Editar
                    </button>
                </div>
            `;
            lista.appendChild(item);
        });
    }

    function editarContacto(contacto) {
        document.getElementById('idContactoEdit').value = contacto.idContacto;
        document.getElementById('cNombreCompleto').value = contacto.nombreCompleto ?? '';
        document.getElementById('cParentesco').value = contacto.parentesco ?? '';
        document.getElementById('cTelefono').value = contacto.telefono ?? '';
        document.getElementById('cCorreo').value = contacto.correo ?? '';
        document.getElementById('cDireccion').value = contacto.direccion ?? '';
        document.getElementById('cContactoPrincipal').value = contacto.contactoPrincipal ? 'true' : 'false';

        document.getElementById('tituloFormContacto').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Editar contacto de emergencia';
        document.getElementById('btnGuardarContacto').innerHTML =
            '<i class="fa-solid fa-check"></i> Guardar cambios';
        document.getElementById('btnCancelarEdicion').classList.remove('oculto');
        document.getElementById('formContacto').scrollIntoView({ behavior: 'smooth' });
    }

    function cancelarEdicionContacto() {
        document.getElementById('formContacto').reset();
        document.getElementById('idContactoEdit').value = '';
        document.getElementById('tituloFormContacto').innerHTML = '<i class="fa-solid fa-user-plus"></i> Registrar nuevo contacto';
        document.getElementById('btnGuardarContacto').innerHTML =
            '<i class="fa-solid fa-check"></i> Registrar contacto';
        document.getElementById('btnCancelarEdicion').classList.add('oculto');
    }

    async function guardarContacto(event) {
        event.preventDefault();

        const idContacto = document.getElementById('idContactoEdit').value;
        const payload = {
            nombreCompleto: document.getElementById('cNombreCompleto').value,
            parentesco: document.getElementById('cParentesco').value,
            telefono: document.getElementById('cTelefono').value,
            correo: document.getElementById('cCorreo').value,
            direccion: document.getElementById('cDireccion').value,
            contactoPrincipal: document.getElementById('cContactoPrincipal').value === 'true'
        };

        const esEdicion = idContacto !== '';
        const url = esEdicion
            ? `${API_BASE}/${idPaciente}/contactos/${idContacto}`
            : `${API_BASE}/${idPaciente}/contactos`;
        const metodo = esEdicion ? 'PUT' : 'POST';

        try {
            const resp = await fetch(url, {
                method: metodo,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!resp.ok) throw new Error('El servidor respondió con error ' + resp.status);

            mostrarMensaje('mensajeContacto', esEdicion ? 'Contacto actualizado.' : 'Contacto registrado.', 'ok');
            cancelarEdicionContacto();
            cargarContactos();
        } catch (err) {
            mostrarMensaje('mensajeContacto', 'No se pudo guardar el contacto: ' + err.message, 'error');
        }
    }
</script>

</body>
</html>
