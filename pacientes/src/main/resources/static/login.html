<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacientes - Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/estilos.css">
<style>
    .login-caja { max-width: 420px; margin: 60px auto 0; }
    .login-caja h2 { justify-content: center; }
    .login-logo { text-align: center; font-size: 42px; color: var(--primary); margin-bottom: 8px; }
</style>
</head>
<body>

<div class="navbar">
    <a href="login.html" class="logo">
        <span class="icono"><i class="fa-solid fa-hospital"></i></span>
        Módulo Pacientes
    </a>
</div>

<div class="contenido">
    <div class="card login-caja">
        <div class="login-logo"><i class="fa-solid fa-hospital-user"></i></div>
        <h2>Iniciar sesión</h2>

        <form action="/login" method="post">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" required autofocus autocomplete="username">

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">

            <div id="mensajeLogin" class="mensaje"></div>

            <button type="submit"><i class="fa-solid fa-right-to-bracket"></i> Ingresar</button>
        </form>
    </div>
</div>

<script>
    // Spring Security redirige a login.html?error cuando las credenciales son invalidas
    // o el usuario/rol esta desactivado
    if (new URLSearchParams(window.location.search).has('error')) {
        const el = document.getElementById('mensajeLogin');
        el.className = 'mensaje error';
        el.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i><span>Usuario o contraseña incorrectos, o la cuenta está desactivada.</span>';
    }
</script>
</body>
</html>
