<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacientes - Ficha del paciente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="navbar">
    <a href="index.html" class="logo">
        <span class="icono"><i class="fa-solid fa-hospital"></i></span>
        Módulo Pacientes
    </a>
    <nav>
        <a href="registrar.html"><i class="fa-solid fa-user-plus"></i> Registrar</a>
        <a href="buscar.html"><i class="fa-solid fa-magnifying-glass"></i> Buscar</a>
        <a href="#" class="activo"><i class="fa-solid fa-id-card"></i> Ficha</a>
    </nav>
</div>

<div class="contenido">
    <button class="btn-volver" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Volver</button>

    <div class="resumen-paciente">
        <div class="avatar" id="avatarPaciente">--</div>
        <div class="datos">
            <h2 id="nombreCompleto">Cargando...</h2>
            <div class="meta">
                <span id="metaCodigoEdad"></span>
                <span id="badgeEstado"></span>
            </div>
        </div>
        <div class="cta">
            <button id="btnIrContactos" class="secundario">
                <i class="fa-solid fa-address-book"></i>
                Ver contactos de emergencia
            </button>
        </div>
    </div>

    <div class="card">
        <h2><i class="fa-solid fa-pen-to-square"></i> Editar datos del paciente</h2>

        <form id="formPaciente" onsubmit="guardarPaciente(event)">
            <div class="seccion-form">Identificación</div>
            <div class="grid-3">
                <div>
                    <label>Tipo documento</label>
                    <select id="tipoDocumento">
                        <option value="DNI">DNI</option>
                        <option value="CE">Carné de Extranjería</option>
                        <option value="Pasaporte">Pasaporte</option>
                    </select>
                </div>
                <div>
                    <label>N.º documento</label>
                    <input id="numeroDocumento" type="text" required>
                </div>
                <div>
                    <label>Estado</label>
                    <select id="estado">
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                        <option value="Fallecido">Fallecido</option>
                    </select>
                </div>
            </div>

            <div class="seccion-form">Datos personales</div>
            <div class="grid-3">
                <div>
                    <label>Nombres</label>
                    <input id="nombres" type="text" required pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' \-]+" title="Solo letras, sin números">
                </div>
                <div>
                    <label>Apellido paterno</label>
                    <input id="apellidoPaterno" type="text" pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' \-]+" title="Solo letras, sin números">
                </div>
                <div>
                    <label>Apellido materno</label>
                    <input id="apellidoMaterno" type="text" pattern="[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' \-]+" title="Solo letras, sin números">
                </div>
            </div>
            <div class="grid-3">
                <div>
                    <label>Fecha nacimiento</label>
                    <input id="fechaNacimiento" type="date">
                </div>
                <div>
                    <label>Sexo</label>
                    <select id="sexo">
                        <option value="Masculino">Masculino</option>
                        <option value="Femenino">Femenino</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <div>
                    <label>Estado civil</label>
                    <select id="estadoCivil">
                        <option value="Soltero">Soltero</option>
                        <option value="Casado">Casado</option>
                        <option value="Viudo">Viudo</option>
                        <option value="Divorciado">Divorciado</option>
                    </select>
                </div>
            </div>

            <div class="seccion-form">Contacto y salud</div>
            <div class="grid-3">
                <div>
                    <label>Teléfono</label>
                    <input id="telefono" type="text">
                </div>
                <div>
                    <label>Correo electrónico</label>
                    <input id="correoElectronico" type="email">
                </div>
                <div>
                    <label>Tipo de sangre</label>
                    <select id="tipoSangre">
                        <option>A+</option><option>A-</option>
                        <option>B+</option><option>B-</option>
                        <option>AB+</option><option>AB-</option>
                        <option>O+</option><option>O-</option>
                    </select>
                </div>
            </div>
            <div class="grid-2">
                <div>
                    <label>Ocupación</label>
                    <input id="ocupacion" type="text">
                </div>
            </div>

            <div class="seccion-form">Dirección</div>
            <div class="grid-2">
                <div>
                    <label>Dirección</label>
                    <input id="direccion" type="text" placeholder="Av., calle, número...">
                </div>
                <div>
                    <label>Distrito</label>
                    <input id="distrito" type="text">
                </div>
            </div>
            <div class="grid-2">
                <div>
                    <label>Provincia</label>
                    <input id="provincia" type="text">
                </div>
                <div>
                    <label>Departamento</label>
                    <input id="departamento" type="text">
                </div>
            </div>

            <div class="seccion-form">Alergias</div>
            <div id="listaAlergias" class="alergias-lista">
                <span style="color:#888; font-size:13px;">Cargando catálogo de alergias...</span>
            </div>
            <div class="agregar-alergia">
                <div>
                    <label>Agregar alergia nueva al catálogo</label>
                    <input id="nuevaAlergiaNombre" type="text" placeholder="Ej: Penicilina">
                </div>
                <div>
                    <label>Tipo</label>
                    <select id="nuevaAlergiaTipo">
                        <option value="Medicamento">Medicamento</option>
                        <option value="Alimento">Alimento</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <button type="button" class="secundario" onclick="agregarAlergiaAlCatalogo()">
                    <i class="fa-solid fa-plus"></i> Agregar
                </button>
            </div>

            <button type="submit">
                <i class="fa-solid fa-check"></i>
                Guardar cambios
            </button>
            <div id="mensajePaciente" class="mensaje"></div>
        </form>
    </div>

    <div id="pieDePagina"></div>
</div>

<script src="js/comun.js"></script>
<script>
    let pacienteActual = null;
    const idPaciente = obtenerIdPacienteDeUrl();

    if (!idPaciente) {
        window.location.href = 'buscar.html';
    } else {
        document.getElementById('btnIrContactos').addEventListener('click', () => irAContactos(idPaciente));
        Promise.all([cargarPaciente(), cargarCatalogoAlergias()]).then(marcarAlergiasSeleccionadas);
    }

    async function cargarPaciente() {
        try {
            const resp = await fetch(`${API_BASE}/${idPaciente}`);
            if (!resp.ok) throw new Error('No se pudo cargar el paciente');
            pacienteActual = await resp.json();
            pintarResumen(pacienteActual);
            pintarFormulario(pacienteActual);
        } catch (err) {
            mostrarMensaje('mensajePaciente', err.message, 'error');
        }
    }

    async function cargarCatalogoAlergias() {
        const cont = document.getElementById('listaAlergias');
        try {
            const resp = await fetch('/api/alergias');
            if (!resp.ok) throw new Error('No se pudo cargar el catálogo');
            const alergias = await resp.json();
            if (alergias.length === 0) {
                cont.innerHTML = '<span style="color:#888; font-size:13px;">Todavía no hay alergias en el catálogo. Agrega la primera abajo.</span>';
                return;
            }
            cont.innerHTML = alergias.map(a => `
                <label class="alergia-chip">
                    <input type="checkbox" value="${a.idAlergia}">
                    ${escapeHtml(a.nombre)} <span style="opacity:.7;">(${escapeHtml(a.tipo ?? '-')})</span>
                </label>
            `).join('');
        } catch (err) {
            cont.innerHTML = `<span style="color:#b91c1c; font-size:13px;">${err.message}</span>`;
        }
    }

    function marcarAlergiasSeleccionadas() {
        const idsPaciente = (pacienteActual?.alergias ?? []).map(a => String(a.idAlergia));
        document.querySelectorAll('#listaAlergias input[type="checkbox"]').forEach(chk => {
            chk.checked = idsPaciente.includes(chk.value);
        });
    }

    async function agregarAlergiaAlCatalogo() {
        const nombre = document.getElementById('nuevaAlergiaNombre').value.trim();
        if (!nombre) return;
        const tipo = document.getElementById('nuevaAlergiaTipo').value;

        try {
            const resp = await fetch('/api/alergias', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, tipo })
            });
            if (!resp.ok) throw new Error('No se pudo agregar la alergia');
            document.getElementById('nuevaAlergiaNombre').value = '';
            await cargarCatalogoAlergias();
            marcarAlergiasSeleccionadas();
        } catch (err) {
            mostrarMensaje('mensajePaciente', err.message, 'error');
        }
    }

    function obtenerAlergiasSeleccionadas() {
        return Array.from(document.querySelectorAll('#listaAlergias input[type="checkbox"]:checked'))
            .map(chk => ({ idAlergia: parseInt(chk.value, 10) }));
    }

    function pintarResumen(p) {
        document.getElementById('avatarPaciente').textContent = iniciales(p.nombres, p.apellidoPaterno);
        document.getElementById('nombreCompleto').textContent =
            `${p.nombres ?? ''} ${p.apellidoPaterno ?? ''} ${p.apellidoMaterno ?? ''}`;
        document.getElementById('metaCodigoEdad').textContent =
            `${p.codigoPaciente ?? '-'} · ${p.edad ?? '-'} años`;
        document.getElementById('badgeEstado').innerHTML =
            `<span class="badge ${p.estado === 'Activo' ? 'si' : 'no'}">${p.estado ?? '-'}</span>`;
    }

    function pintarFormulario(p) {
        document.getElementById('tipoDocumento').value = p.tipoDocumento ?? 'DNI';
        document.getElementById('numeroDocumento').value = p.numeroDocumento ?? '';
        document.getElementById('estado').value = p.estado ?? 'Activo';
        document.getElementById('nombres').value = p.nombres ?? '';
        document.getElementById('apellidoPaterno').value = p.apellidoPaterno ?? '';
        document.getElementById('apellidoMaterno').value = p.apellidoMaterno ?? '';
        document.getElementById('fechaNacimiento').value = p.fechaNacimiento ? p.fechaNacimiento.substring(0, 10) : '';
        document.getElementById('sexo').value = p.sexo ?? 'Masculino';
        document.getElementById('estadoCivil').value = p.estadoCivil ?? 'Soltero';
        document.getElementById('telefono').value = p.telefono ?? '';
        document.getElementById('correoElectronico').value = p.correoElectronico ?? '';
        document.getElementById('tipoSangre').value = p.tipoSangre ?? 'O+';
        document.getElementById('ocupacion').value = p.ocupacion ?? '';

        const dir = p.direccion ?? {};
        document.getElementById('direccion').value = dir.direccion ?? '';
        document.getElementById('distrito').value = dir.distrito ?? '';
        document.getElementById('provincia').value = dir.provincia ?? '';
        document.getElementById('departamento').value = dir.departamento ?? '';
    }

    async function guardarPaciente(event) {
        event.preventDefault();
        if (!pacienteActual) return;

        const payload = {
            ...pacienteActual,
            tipoDocumento: document.getElementById('tipoDocumento').value,
            numeroDocumento: document.getElementById('numeroDocumento').value,
            estado: document.getElementById('estado').value,
            nombres: document.getElementById('nombres').value,
            apellidoPaterno: document.getElementById('apellidoPaterno').value,
            apellidoMaterno: document.getElementById('apellidoMaterno').value,
            fechaNacimiento: document.getElementById('fechaNacimiento').value || null,
            sexo: document.getElementById('sexo').value,
            estadoCivil: document.getElementById('estadoCivil').value,
            telefono: document.getElementById('telefono').value,
            correoElectronico: document.getElementById('correoElectronico').value,
            tipoSangre: document.getElementById('tipoSangre').value,
            ocupacion: document.getElementById('ocupacion').value,
            direccion: {
                ...(pacienteActual.direccion ?? {}),
                direccion: document.getElementById('direccion').value,
                distrito: document.getElementById('distrito').value,
                provincia: document.getElementById('provincia').value,
                departamento: document.getElementById('departamento').value
            },
            alergias: obtenerAlergiasSeleccionadas()
        };

        try {
            const resp = await fetch(`${API_BASE}/${idPaciente}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!resp.ok) throw new Error(await leerErrorApi(resp));
            pacienteActual = await resp.json();
            pintarResumen(pacienteActual);
            pintarFormulario(pacienteActual);
            marcarAlergiasSeleccionadas();
            mostrarMensaje('mensajePaciente', 'Datos del paciente actualizados correctamente.', 'ok');
        } catch (err) {
            mostrarMensaje('mensajePaciente', 'No se pudo guardar: ' + err.message, 'error');
        }
    }
</script>

</body>
</html>
