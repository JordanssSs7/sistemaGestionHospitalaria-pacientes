<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacientes - Registrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<div class="navbar">
    <a href="index.html" class="logo">
        <span class="icono"><i class="fa-solid fa-hospital"></i></span>
        Módulo Pacientes
    </a>
    <nav>
        <a href="registrar.html" class="activo"><i class="fa-solid fa-user-plus"></i> Registrar</a>
        <a href="buscar.html"><i class="fa-solid fa-magnifying-glass"></i> Buscar</a>
    </nav>
</div>

<div class="contenido">
    <button class="btn-volver" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i> Volver</button>

    <div class="card">
        <h2><i class="fa-solid fa-user-plus"></i> Registrar nuevo paciente</h2>

        <form id="formRegistrar" onsubmit="registrarPaciente(event)">
            <div class="seccion-form">Identificación</div>
            <div class="grid-3">
                <div>
                    <label>Tipo documento</label>
                    <select id="tipoDocumento">
                        <option value="DNI">DNI</option>
                        <option value="CE">Carné de Extranjería</option>
                        <option value="Pasaporte">Pasaporte</option>
                    </select>
                </div>
                <div>
                    <label>N.º documento</label>
                    <input id="numeroDocumento" type="text" required>
                </div>
                <div>
                    <label>Estado</label>
                    <select id="estado">
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>
                </div>
            </div>

            <div class="seccion-form">Datos personales</div>
            <div class="grid-3">
                <div>
                    <label>Nombres</label>
                    <input id="nombres" type="text" required>
                </div>
                <div>
                    <label>Apellido paterno</label>
                    <input id="apellidoPaterno" type="text">
                </div>
                <div>
                    <label>Apellido materno</label>
                    <input id="apellidoMaterno" type="text">
                </div>
            </div>
            <div class="grid-3">
                <div>
                    <label>Fecha nacimiento</label>
                    <input id="fechaNacimiento" type="date">
                </div>
                <div>
                    <label>Sexo</label>
                    <select id="sexo">
                        <option value="Masculino">Masculino</option>
                        <option value="Femenino">Femenino</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <div>
                    <label>Estado civil</label>
                    <select id="estadoCivil">
                        <option value="Soltero">Soltero</option>
                        <option value="Casado">Casado</option>
                        <option value="Viudo">Viudo</option>
                        <option value="Divorciado">Divorciado</option>
                    </select>
                </div>
            </div>

            <div class="seccion-form">Contacto y salud</div>
            <div class="grid-3">
                <div>
                    <label>Teléfono</label>
                    <input id="telefono" type="text">
                </div>
                <div>
                    <label>Correo electrónico</label>
                    <input id="correoElectronico" type="email">
                </div>
                <div>
                    <label>Tipo de sangre</label>
                    <select id="tipoSangre">
                        <option>A+</option><option>A-</option>
                        <option>B+</option><option>B-</option>
                        <option>AB+</option><option>AB-</option>
                        <option>O+</option><option>O-</option>
                    </select>
                </div>
            </div>
            <div class="grid-2">
                <div>
                    <label>Ocupación</label>
                    <input id="ocupacion" type="text">
                </div>
            </div>

            <div class="seccion-form">Dirección</div>
            <div class="grid-2">
                <div>
                    <label>Dirección</label>
                    <input id="direccion" type="text" placeholder="Av., calle, número...">
                </div>
                <div>
                    <label>Distrito</label>
                    <input id="distrito" type="text">
                </div>
            </div>
            <div class="grid-2">
                <div>
                    <label>Provincia</label>
                    <input id="provincia" type="text">
                </div>
                <div>
                    <label>Departamento</label>
                    <input id="departamento" type="text">
                </div>
            </div>

            <div class="seccion-form">Alergias</div>
            <div id="listaAlergias" class="alergias-lista">
                <span style="color:#888; font-size:13px;">Cargando catálogo de alergias...</span>
            </div>
            <div class="agregar-alergia">
                <div>
                    <label>Agregar alergia nueva al catálogo</label>
                    <input id="nuevaAlergiaNombre" type="text" placeholder="Ej: Penicilina">
                </div>
                <div>
                    <label>Tipo</label>
                    <select id="nuevaAlergiaTipo">
                        <option value="Medicamento">Medicamento</option>
                        <option value="Alimento">Alimento</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <button type="button" class="secundario" onclick="agregarAlergiaAlCatalogo()">
                    <i class="fa-solid fa-plus"></i> Agregar
                </button>
            </div>

            <button type="submit">
                <i class="fa-solid fa-check"></i>
                Registrar paciente
            </button>
            <div id="mensajeRegistrar" class="mensaje"></div>
        </form>
    </div>

    <div id="pieDePagina"></div>
</div>

<script src="js/comun.js"></script>
<script>
    async function cargarCatalogoAlergias() {
        const cont = document.getElementById('listaAlergias');
        try {
            const resp = await fetch('/api/alergias');
            if (!resp.ok) throw new Error('No se pudo cargar el catálogo');
            const alergias = await resp.json();
            pintarCatalogoAlergias(alergias);
        } catch (err) {
            cont.innerHTML = `<span style="color:#b91c1c; font-size:13px;">${err.message}</span>`;
        }
    }

    function pintarCatalogoAlergias(alergias) {
        const cont = document.getElementById('listaAlergias');
        if (alergias.length === 0) {
            cont.innerHTML = '<span style="color:#888; font-size:13px;">Todavía no hay alergias en el catálogo. Agrega la primera abajo.</span>';
            return;
        }
        cont.innerHTML = alergias.map(a => `
            <label class="alergia-chip">
                <input type="checkbox" value="${a.idAlergia}">
                ${escapeHtml(a.nombre)} <span style="opacity:.7;">(${escapeHtml(a.tipo ?? '-')})</span>
            </label>
        `).join('');
    }

    async function agregarAlergiaAlCatalogo() {
        const nombre = document.getElementById('nuevaAlergiaNombre').value.trim();
        if (!nombre) return;
        const tipo = document.getElementById('nuevaAlergiaTipo').value;

        try {
            const resp = await fetch('/api/alergias', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, tipo })
            });
            if (!resp.ok) throw new Error('No se pudo agregar la alergia');
            document.getElementById('nuevaAlergiaNombre').value = '';
            cargarCatalogoAlergias();
        } catch (err) {
            mostrarMensaje('mensajeRegistrar', err.message, 'error');
        }
    }

    function obtenerAlergiasSeleccionadas() {
        return Array.from(document.querySelectorAll('#listaAlergias input[type="checkbox"]:checked'))
            .map(chk => ({ idAlergia: parseInt(chk.value, 10) }));
    }

    cargarCatalogoAlergias();

    async function registrarPaciente(event) {
        event.preventDefault();

        const payload = {
            tipoDocumento: document.getElementById('tipoDocumento').value,
            numeroDocumento: document.getElementById('numeroDocumento').value,
            estado: document.getElementById('estado').value,
            nombres: document.getElementById('nombres').value,
            apellidoPaterno: document.getElementById('apellidoPaterno').value,
            apellidoMaterno: document.getElementById('apellidoMaterno').value,
            fechaNacimiento: document.getElementById('fechaNacimiento').value || null,
            sexo: document.getElementById('sexo').value,
            estadoCivil: document.getElementById('estadoCivil').value,
            telefono: document.getElementById('telefono').value,
            correoElectronico: document.getElementById('correoElectronico').value,
            tipoSangre: document.getElementById('tipoSangre').value,
            ocupacion: document.getElementById('ocupacion').value,
            direccion: {
                direccion: document.getElementById('direccion').value,
                distrito: document.getElementById('distrito').value,
                provincia: document.getElementById('provincia').value,
                departamento: document.getElementById('departamento').value
            },
            alergias: obtenerAlergiasSeleccionadas()
        };

        try {
            const resp = await fetch(`${API_BASE}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!resp.ok) throw new Error('El servidor respondió con error ' + resp.status);

            const nuevoPaciente = await resp.json();
            mostrarMensaje('mensajeRegistrar', 'Paciente registrado correctamente. Redirigiendo...', 'ok');
            setTimeout(() => irAPaciente(nuevoPaciente.idPaciente), 800);
        } catch (err) {
            mostrarMensaje('mensajeRegistrar', 'No se pudo registrar: ' + err.message, 'error');
        }
    }
</script>

</body>
</html>
